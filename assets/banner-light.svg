<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Omar ElHawary · Applied AI Engineer / Forward Deployed Engineer</title>
  <desc id="d">I build and evaluate the knowledge layer behind AI. Evals, retrieval grounding, MCP, agent memory.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D9DBD2"/>
    </pattern>
    <clipPath id="panel"><rect x="800" y="86" width="416" height="228" rx="12"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .a{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
    .r{opacity:0;animation:in .5s ease-out forwards}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.8s cubic-bezier(.4,0,.2,1) .9s forwards}
    .caret{animation:blink 1s steps(1) infinite}
    .dot{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.a,.r{opacity:1;animation:none}.bar{transform:none;animation:none}.caret,.dot{animation:none}}
  </style>

  <rect width="1280" height="400" fill="#F6F7F2"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <g class="a" style="animation-delay:.05s">
    <rect class="dot" x="64" y="98" width="10" height="10" fill="#3F6B00"/>
    <text x="84" y="108" class="mono" font-size="16" fill="#121410" font-weight="500">omar.elhawary</text>
    <text x="214" y="108" class="mono" font-size="16" fill="#8A8D82">·</text>
    <text x="232" y="108" class="mono" font-size="16" fill="#55584F">Applied AI Engineer / Forward Deployed Engineer</text>
  </g>

  <g class="a sans" style="animation-delay:.2s" font-size="54" font-weight="600" letter-spacing="-1.8" fill="#121410">
    <text x="62" y="186">I build and <tspan fill="#3F6B00">evaluate</tspan> the</text>
    <text x="62" y="250">knowledge layer behind AI.</text>
  </g>

  <g class="a mono" style="animation-delay:.4s" font-size="14" fill="#33352F">
    <rect x="64" y="284" width="62" height="30" rx="6" fill="none" stroke="#C9CCC0"/>
    <text x="75" y="304">Evals</text>
    <rect x="134" y="284" width="180" height="30" rx="6" fill="none" stroke="#C9CCC0"/>
    <text x="145" y="304">Retrieval grounding</text>
    <rect x="322" y="284" width="46" height="30" rx="6" fill="none" stroke="#C9CCC0"/>
    <text x="333" y="304">MCP</text>
    <rect x="376" y="284" width="122" height="30" rx="6" fill="none" stroke="#C9CCC0"/>
    <text x="387" y="304">Agent memory</text>
  </g>

  <g class="a" style="animation-delay:.5s">
    <rect x="800" y="86" width="416" height="228" rx="12" fill="#FFFFFF" stroke="#D9DBD2"/>
    <g clip-path="url(#panel)">
      <text x="818" y="114" class="mono" font-size="13" fill="#5E6157">$ eval run --suite selected-work <tspan class="caret" fill="#3F6B00">▋</tspan></text>
      <rect x="800" y="128" width="416" height="2" fill="#E7E9E1"/>
      <rect class="bar" x="800" y="128" width="416" height="2" fill="#3F6B00"/>

      <g class="r" style="animation-delay:1.1s">
        <rect x="818" y="142" width="58" height="20" rx="4" fill="#FFB547"/>
        <text x="827" y="156" class="mono" font-size="12" fill="#0B0C0A">FOUND</text>
        <text x="892" y="157" class="sans" font-size="15" fill="#121410">"Cited" wasn’t measuring citation</text>
      </g>
      <rect x="800" y="174" width="416" height="1" fill="#E7E9E1"/>
      <g class="r" style="animation-delay:1.5s">
        <rect x="818" y="186" width="46" height="20" rx="4" fill="#C8F135"/>
        <text x="827" y="200" class="mono" font-size="12" fill="#0B0C0A">PASS</text>
        <text x="892" y="201" class="sans" font-size="15" fill="#121410">Citation integrity in advisor answers</text>
      </g>
      <rect x="800" y="218" width="416" height="1" fill="#E7E9E1"/>
      <g class="r" style="animation-delay:1.9s">
        <rect x="818" y="230" width="46" height="20" rx="4" fill="#C8F135"/>
        <text x="827" y="244" class="mono" font-size="12" fill="#0B0C0A">PASS</text>
        <text x="892" y="245" class="sans" font-size="15" fill="#121410">Refusing to assert a false zero</text>
      </g>
      <rect x="800" y="262" width="416" height="1" fill="#E7E9E1"/>
      <g class="r" style="animation-delay:2.3s">
        <rect x="818" y="274" width="40" height="20" rx="4" fill="#F0F1EB" stroke="#C9CCC0"/>
        <text x="827" y="288" class="mono" font-size="12" fill="#121410">OSS</text>
        <text x="892" y="289" class="sans" font-size="15" fill="#121410">File-based agent memory</text>
      </g>
    </g>
  </g>
</svg>
